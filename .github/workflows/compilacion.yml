name: Compilación

# Compila la aplicación de Windows en cada push a main para detectar a tiempo
# errores de Rust o del empaquetado. Los ejecutables quedan como artefacto.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compilacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Compilación para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npx tauri build
      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: volta-windows
          path: |
            src-tauri/target/release/volta.exe
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
