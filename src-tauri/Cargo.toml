[package]
name = "volta"
version = "0.12.0"
description = "Volta: simulador de física para Windows"
authors = ["Eliam Mojardin Ibarra"]
license = "MIT"
repository = "https://github.com/Eliam4510/volta-fisica"
edition = "2021"
rust-version = "1.77"

[lib]
name = "volta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
