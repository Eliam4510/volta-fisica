<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta · Electrostática</title>
<link rel="stylesheet" href="../fuentes/fuentes.css">
<link rel="icon" href="../marca/icono-app.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../componentes/componentes.css">
<script src="../iconos/sprite.js"></script>
<style>
  /* Piezas propias de Electrostática (el panel inferior y los comandos vienen del sistema) */
  .barra-e { grid-template-columns: 136px minmax(0, 1fr) 92px; }
  /* Barra de energía con signo: la potencial eléctrica es negativa (cero en el infinito) */
  .barra-e .riel .cero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--linea-fuerte); }
  .nota-energia { margin: var(--e-1) 0 0; font-size: var(--t-micro); color: var(--texto-3); }
  .nota-energia .num { color: var(--texto-2); }
  .campo input[readonly] { color: var(--texto-3); }
  .fila .segmentado { justify-self: start; }
  .var.constante .valor { white-space: nowrap; font-size: var(--t-pequeno); }
</style>
</head>
<body>
<div class="espacio">
  <!-- ============================ Barra superior ============================ -->
  <header class="barra">
    <a class="marca" href="inicio.html" data-ayuda="Inicio|Home">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6.5 L16 23 L26 6.5" stroke-width="2.4"/><path d="M4 23 H28" stroke-width="2.4"/><path d="M8.5 23 L5.5 26 M13.5 23 L10.5 26 M18.5 23 L15.5 26 M23.5 23 L20.5 26" stroke-width="1.4"/><circle cx="26" cy="6.5" r="2.6" fill="currentColor" stroke="none"/></svg>
      <b>Volta</b>
    </a>
    <span class="separador-v"></span>
    <nav class="migas">
      <button class="btn btn-compacto">Electrostática<svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
      <span class="sep">/</span>
      <button class="btn btn-compacto">Cargas y campos<svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
    </nav>
    <span class="escena-titulo"><span class="chip">MEXT 2020</span>&nbsp; <b>Partícula entre dos cargas iguales</b></span>
    <span class="sp"></span>
    <div class="transporte">
      <button class="btn btn-icono" id="b-reiniciar" data-ayuda="Reiniciar|Reset|Inicio"><svg class="ico"><use href="#i-reiniciar"/></svg></button>
      <button class="btn btn-icono" id="b-atras" data-ayuda="Retroceder un cuadro|Step back|←"><svg class="ico"><use href="#i-paso-atras"/></svg></button>
      <button class="btn btn-primario btn-reproducir" id="b-play" data-ayuda="Reproducir|Play|Espacio"><svg class="ico"><use href="#i-reproducir"/></svg></button>
      <button class="btn btn-icono" id="b-adelante" data-ayuda="Avanzar un cuadro|Step forward|→"><svg class="ico"><use href="#i-paso-adelante"/></svg></button>
    </div>
    <div class="reloj" id="reloj"></div>
    <div class="segmentado" data-exclusivo id="velocidades" data-ayuda="Velocidad de reproducción|Playback speed">
      <button data-v="0.25">¼×</button><button data-v="0.5">½×</button><button data-v="1" aria-pressed="true">1×</button><button data-v="2">2×</button>
    </div>
    <span class="sp"></span>
    <span class="modo" data-ayuda="Modo preciso: Dormand–Prince con eventos exactos|Precise mode">Preciso</span>
    <span class="separador-v"></span>
    <button class="btn btn-icono" id="b-deshacer" data-ayuda="Deshacer|Undo|Ctrl Z"><svg class="ico"><use href="#i-deshacer"/></svg></button>
    <button class="btn btn-icono" id="b-rehacer" data-ayuda="Rehacer|Redo|Ctrl Y"><svg class="ico"><use href="#i-rehacer"/></svg></button>
    <button class="btn btn-icono" data-accion="tema" data-ayuda="Cambiar tema|Theme"><svg class="ico"><use href="#i-tema-oscuro"/></svg></button>
    <button class="btn btn-icono" id="b-comandos" data-ayuda="Comandos|Command palette|Ctrl K"><svg class="ico"><use href="#i-buscar"/></svg></button>
  </header>

  <!-- ============================ Panel izquierdo ============================ -->
  <aside class="panel panel-izq">
    <div class="desplaza">
      <div class="seccion">
        <div class="panel-cab">Objetos</div>
        <div class="paleta" data-exclusivo id="paleta-objetos">
          <button class="herr" data-objeto="carga+" data-ayuda="Carga positiva: clic en el lienzo para colocarla|Positive point charge"><svg class="ico"><use href="#o-carga-positiva"/></svg><span>Carga +</span></button>
          <button class="herr" data-objeto="carga-" data-ayuda="Carga negativa: clic en el lienzo para colocarla|Negative point charge"><svg class="ico"><use href="#o-carga-negativa"/></svg><span>Carga −</span></button>
          <button class="herr" data-objeto="esfera" data-ayuda="Esfera cargada|Charged sphere"><svg class="ico"><use href="#o-esfera-cargada"/></svg><span>Esfera</span></button>
          <button class="herr" data-objeto="hilo" data-ayuda="Hilo infinito|Infinite line charge"><svg class="ico"><use href="#o-hilo-infinito"/></svg><span>Hilo infinito</span></button>
          <button class="herr" data-objeto="segmento" data-ayuda="Segmento cargado|Charged segment"><svg class="ico"><use href="#o-segmento-cargado"/></svg><span>Segmento</span></button>
          <button class="herr" data-objeto="anillo" data-ayuda="Anillo cargado|Charged ring"><svg class="ico"><use href="#o-anillo"/></svg><span>Anillo</span></button>
          <button class="herr" data-objeto="lamina" data-ayuda="Lámina cargada|Charged sheet"><svg class="ico"><use href="#o-lamina"/></svg><span>Lámina</span></button>
          <button class="herr" data-objeto="uniforme" data-ayuda="Campo uniforme|Uniform field"><svg class="ico"><use href="#o-campo-uniforme"/></svg><span>Campo uniforme</span></button>
        </div>
      </div>
      <div class="seccion">
        <div class="panel-cab">Instrumentos</div>
        <div class="paleta" data-exclusivo id="paleta-instrumentos">
          <button class="herr" data-instrumento="sonda" data-ayuda="Sonda de campo|Field probe"><svg class="ico"><use href="#n-sonda-campo"/></svg><span>Sonda de campo</span></button>
          <button class="herr" data-instrumento="potencial" data-ayuda="Sonda de potencial|Potential probe"><svg class="ico"><use href="#n-sonda-potencial"/></svg><span>Potencial</span></button>
          <button class="herr" data-instrumento="voltimetro" data-ayuda="Voltímetro|Voltmeter"><svg class="ico"><use href="#n-voltimetro"/></svg><span>Voltímetro</span></button>
          <button class="herr" data-instrumento="gauss" data-ayuda="Superficie gaussiana|Gaussian surface"><svg class="ico"><use href="#n-superficie-gauss"/></svg><span>Gauss</span></button>
        </div>
      </div>
      <div class="seccion">
        <div class="panel-cab">Escena<span class="sp"></span><button class="btn btn-compacto btn-icono" data-ayuda="Añadir objeto|Add object"><svg class="ico"><use href="#i-mas"/></svg></button></div>
        <div class="arbol" id="arbol"></div>
      </div>
    </div>
  </aside>

  <!-- ============================ Lienzo ============================ -->
  <main class="lienzo-area" id="area">
    <canvas id="lienzo"></canvas>
    <div class="flotante ar-der" role="group" aria-label="Capas">
      <svg class="ico"><use href="#i-capas"/></svg>
      <button class="capa-btn" data-capa="lineas" aria-pressed="true" data-ayuda="Líneas de campo|Field lines|L">Líneas de campo</button>
      <button class="capa-btn" data-capa="equi" aria-pressed="true" data-ayuda="Equipotenciales|Equipotentials|E">Equipotenciales</button>
      <button class="capa-btn" data-capa="mapa" aria-pressed="false" data-ayuda="Mapa de potencial|Potential map|M">Mapa de <i class="sim">V</i></button>
      <button class="capa-btn" data-capa="malla" aria-pressed="false" data-ayuda="Malla de vectores de campo|Field vector grid">Malla de <i class="sim">E</i></button>
      <button class="capa-btn" data-capa="vectores" aria-pressed="true">Vectores</button>
      <button class="capa-btn" data-capa="traza" aria-pressed="true">Traza</button>
    </div>
    <div class="flotante ab-izq" id="coords"><span class="sim">x</span><span class="num" id="cx">—</span><span class="sim">y</span><span class="num" id="cy">—</span><span class="sim">V</span><span class="num" id="cv">—</span></div>
    <div class="flotante ab-der">
      <button class="btn btn-icono btn-compacto" id="b-zoom-menos" data-ayuda="Alejar|Zoom out|−"><svg class="ico"><use href="#i-zoom-menos"/></svg></button>
      <span class="num" id="zoom">100 %</span>
      <button class="btn btn-icono btn-compacto" id="b-zoom-mas" data-ayuda="Acercar|Zoom in|+"><svg class="ico"><use href="#i-zoom-mas"/></svg></button>
      <span class="sep"></span>
      <button class="btn btn-compacto" id="b-encuadrar" data-ayuda="Encuadrar todo|Fit to view|F"><svg class="ico"><use href="#i-encuadrar"/></svg>Encuadrar</button>
    </div>
  </main>

  <!-- ============================ Panel derecho ============================ -->
  <aside class="panel panel-der">
    <div class="desplaza">
      <div class="panel-cab">Inspector</div>
      <div id="inspector"></div>
      <div class="panel-cab" style="border-top:1px solid var(--linea-suave)">Variables<span class="sp"></span><button class="btn btn-compacto btn-icono" data-ayuda="Añadir variable|Add variable"><svg class="ico"><use href="#i-mas"/></svg></button></div>
      <div class="variables" id="variables"></div>
    </div>
  </aside>

  <!-- ============================ Panel inferior ============================ -->
  <section class="panel panel-inf">
    <div class="inf-cab">
      <div class="pestanas" role="tablist" id="pest">
        <button class="pestana" role="tab" aria-selected="true" aria-controls="p-graficas">Gráficas</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-energia">Energía</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-eventos">Eventos</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-tabla">Tabla</button>
      </div>
      <span class="sp" style="flex:1"></span>
      <button class="btn btn-compacto" id="b-exportar"><svg class="ico"><use href="#i-exportar"/></svg>Exportar datos</button>
    </div>
    <div class="linea-tiempo"><canvas id="tl"></canvas></div>
    <div class="graficas" id="p-graficas" data-grupo="pest">
      <div class="grafica"><div class="grafica-cab"><span><span class="sim">y</span> contra <span class="sim">t</span></span><span class="lect" id="l1"></span></div><canvas id="g1"></canvas></div>
      <div class="grafica"><div class="grafica-cab"><span><span class="sim">v<span class="sub">y</span></span> contra <span class="sim">t</span></span><span class="lect" id="l2"></span></div><canvas id="g2"></canvas></div>
      <div class="grafica"><div class="grafica-cab"><span><span class="sim">U</span> contra <span class="sim">y</span> en <span class="sim">x</span> = 0 · nivel <span class="sim">E</span></span><span class="lect" id="l3"></span></div><canvas id="g3"></canvas></div>
    </div>
    <div class="energia" id="p-energia" data-grupo="pest" hidden>
      <div class="barras"><div id="barras" style="display:flex;flex-direction:column;gap:var(--e-2)"></div><p class="nota-energia" id="deriva"></p></div>
      <div class="grafica"><div class="grafica-cab"><span>Energía contra <span class="sim">t</span></span><span class="lect">mJ</span></div><canvas id="g4"></canvas></div>
    </div>
    <div class="lista-eventos" id="p-eventos" data-grupo="pest" hidden><table class="tabla" id="t-eventos"></table></div>
    <div class="lista-eventos" id="p-tabla" data-grupo="pest" hidden><table class="tabla" id="t-datos"></table></div>
  </section>
</div>

<!-- Paleta de comandos -->
<div class="velo comandos-velo" id="velo-comandos" hidden>
  <div class="comandos" role="dialog" aria-label="Comandos">
    <div class="comandos-buscar"><svg class="ico ico-20" style="color:var(--texto-3)"><use href="#i-buscar"/></svg><input id="cmd-q" placeholder="Escribe un comando o un objeto"><kbd>Esc</kbd></div>
    <div class="comandos-lista" id="cmd-lista"></div>
  </div>
</div>

<script type="module" src="../lienzo/trazo.js"></script>
<script type="module" src="../lienzo/dominios/electrostatica.js"></script>
<script type="module" src="../lienzo/grafica.js"></script>
<script type="module" src="../componentes/linea-tiempo.js"></script>
<script type="module" src="../componentes/espacio.js"></script>
<script type="module" src="electrostatica.js"></script>
</body>
</html>
