<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta · Termodinámica</title>
<link rel="stylesheet" href="../fuentes/fuentes.css">
<link rel="icon" href="../marca/icono-app.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../componentes/componentes.css">
<script src="../iconos/sprite.js"></script>
<style>
  /* Solo ajustes propios de este prototipo; todo lo demás viene del sistema */
  .grafica-cab .sim .sub { font-size: .68em; vertical-align: -0.25em; font-style: normal; }
  #p-graficas { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); }
  /* Registro de energía en tres columnas (dos de barras con signo y una gráfica) */
  .energia { grid-auto-flow: initial; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .9fr); }
  .barras { gap: 3px; }
  .barra-e { grid-template-columns: 112px minmax(0, 1fr) 76px; }
  .barra-e .riel::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--linea-fuerte); z-index: 1; }
  .barras-pie .sim { color: var(--texto-2); }
  .fila .btn-secundario { justify-self: start; }
  .aviso-lienzo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .migas { flex: none; }
  .escena-btn { gap: var(--e-2); min-width: 0; max-width: 470px; padding: 0 var(--e-2); color: var(--texto-3); font-weight: 400; }
  .escena-btn b { color: var(--texto-2); font-weight: var(--peso-medio); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .escena-btn .ico { color: var(--texto-3); }
  #menu-escenas { position: fixed; z-index: 40; min-width: 400px; max-height: calc(100vh - 64px); overflow: auto; }
  #menu-escenas .menu-item .nombre-escena { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu-escenas .menu-item .chip { margin-left: auto; flex: none; }
  #menu-escenas .menu-item[aria-current="true"] { background: var(--campo); }
  .lecturas .sim .r { font-style: normal; }
  .lecturas .sim.palabra { font-style: normal; font-family: var(--fuente-interfaz); font-size: var(--t-pequeno); }
  .var { grid-template-columns: 46px minmax(0, 1fr) minmax(84px, auto); }
  .var .sim { text-align: left; white-space: nowrap; }
  .examen { display: flex; flex-direction: column; gap: 5px; }
  .ex-fila { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 30px 26px; align-items: baseline; column-gap: 6px; font-size: var(--t-pequeno); }
  .ex-n { color: var(--texto-3); font-family: var(--fuente-numeros); font-size: 11px; }
  .ex-etq { color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-etq .sim { font-size: 14px; }
  .ex-etq sub { font-size: .72em; }
  .ex-v { text-align: right; font-family: var(--fuente-numeros); font-variant-numeric: tabular-nums; color: var(--texto); }
  .ex-u { color: var(--texto-3); font-size: 11px; }
  .ex-op { color: var(--texto-3); font-family: var(--fuente-numeros); font-size: 11px; text-align: right; }
  #acciones-otro .fila .btn-secundario, #acciones-otro .fila .conmutador { justify-self: start; }
  /* Listas desplegables del inspector (escenas propias) */
  .campo select { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--texto); font-size: var(--t-base); outline: none; cursor: pointer; }
  .campo select option { background: var(--panel); color: var(--texto); }
</style>
</head>
<body>
<div class="espacio">
  <!-- ============================ Barra superior ============================ -->
  <header class="barra">
    <a class="marca" href="inicio.html" data-ayuda="Inicio|Home">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6.5 L16 23 L26 6.5" stroke-width="2.4"/><path d="M4 23 H28" stroke-width="2.4"/><path d="M8.5 23 L5.5 26 M13.5 23 L10.5 26 M18.5 23 L15.5 26 M23.5 23 L20.5 26" stroke-width="1.4"/><circle cx="26" cy="6.5" r="2.6" fill="currentColor" stroke="none"/></svg>
      <b>Volta</b>
    </a>
    <span class="separador-v"></span>
    <nav class="migas">
      <button class="btn btn-compacto">Termodinámica<svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
      <span class="sep">/</span>
      <button class="btn btn-compacto">Laboratorio de gases<svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
    </nav>
    <button class="btn btn-compacto escena-btn" id="b-escenas" aria-haspopup="menu" data-ayuda="Cambiar de escena|Scenes"><span id="escena-chip" class="chip lleno">MEXT 2019 P4</span><b id="escena-nombre">Émbolo con pesa en un baño térmico</b><svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
    <span class="sp"></span>
    <div class="transporte">
      <button class="btn btn-icono" id="b-reiniciar" data-ayuda="Reiniciar|Reset|Inicio"><svg class="ico"><use href="#i-reiniciar"/></svg></button>
      <button class="btn btn-icono" id="b-atras" data-ayuda="Retroceder un cuadro|Step back|←"><svg class="ico"><use href="#i-paso-atras"/></svg></button>
      <button class="btn btn-primario btn-reproducir" id="b-play" data-ayuda="Reproducir|Play|Espacio"><svg class="ico"><use href="#i-reproducir"/></svg></button>
      <button class="btn btn-icono" id="b-adelante" data-ayuda="Avanzar un cuadro|Step forward|→"><svg class="ico"><use href="#i-paso-adelante"/></svg></button>
    </div>
    <div class="reloj" id="reloj"></div>
    <div class="segmentado" data-exclusivo id="velocidades" data-ayuda="Velocidad de reproducción|Playback speed">
      <button data-v="0.5">½×</button><button data-v="1" aria-pressed="true">1×</button><button data-v="2">2×</button><button data-v="4">4×</button>
    </div>
    <span class="sp"></span>
    <span class="modo" data-ayuda="Modo preciso: contabilidad de energía exacta|Precise mode">Preciso</span>
    <span class="separador-v"></span>
    <button class="btn btn-icono" id="b-deshacer" data-ayuda="Deshacer|Undo|Ctrl Z"><svg class="ico"><use href="#i-deshacer"/></svg></button>
    <button class="btn btn-icono" id="b-rehacer" data-ayuda="Rehacer|Redo|Ctrl Y"><svg class="ico"><use href="#i-rehacer"/></svg></button>
    <button class="btn btn-icono" data-accion="abrir" data-ayuda="Abrir escena (cualquier módulo)|Open|Ctrl O"><svg class="ico"><use href="#i-carpeta"/></svg></button>
    <button class="btn btn-icono" data-accion="guardar" data-ayuda="Guardar escena (Mayús: guardar como)|Save|Ctrl S"><svg class="ico"><use href="#i-guardar"/></svg></button>
    <button class="btn btn-icono" data-accion="tema" data-ayuda="Cambiar tema|Theme"><svg class="ico"><use href="#i-tema-oscuro"/></svg></button>
    <button class="btn btn-icono" id="b-comandos" data-ayuda="Comandos|Command palette|Ctrl K"><svg class="ico"><use href="#i-buscar"/></svg></button>
  </header>

  <!-- ============================ Panel izquierdo ============================ -->
  <aside class="panel panel-izq">
    <div class="desplaza">
      <div class="seccion">
        <div class="panel-cab">Objetos</div>
        <div class="paleta" id="paleta-objetos">
          <button class="herr" data-herr="cilindro" data-ayuda="Cilindro con su gas y su émbolo: clic en el lienzo|Cylinder"><svg class="ico"><use href="#o-cilindro"/></svg><span>Cilindro</span></button>
          <button class="herr" data-herr="recipiente" data-ayuda="Recipiente rígido con gas: clic donde va en la fila|Rigid vessel"><svg class="ico"><use href="#o-recipiente"/></svg><span>Recipiente</span></button>
          <button class="herr" data-herr="embolo" data-ayuda="Émbolo libre entre dos recipientes: clic en el hueco entre ellos|Free piston"><svg class="ico"><use href="#o-embolo"/></svg><span>Émbolo</span></button>
          <button class="herr" data-herr="tabique" data-ayuda="Tabique fijo entre dos recipientes|Partition"><svg class="ico"><use href="#o-tabique"/></svg><span>Tabique</span></button>
          <button class="herr" data-herr="valvula" data-ayuda="Válvula o llave entre dos recipientes|Valve"><svg class="ico"><use href="#o-valvula"/></svg><span>Válvula</span></button>
          <button class="herr" data-herr="pesa" data-ayuda="Pesa sobre el émbolo del cilindro|Weight"><svg class="ico"><use href="#o-pesa"/></svg><span>Pesa</span></button>
          <button class="herr" data-herr="calentador" data-ayuda="Calentador en el cilindro o en un recipiente|Heater"><svg class="ico"><use href="#o-calentador"/></svg><span>Calentador</span></button>
          <button class="herr" data-herr="bano" data-ayuda="Baño térmico del cilindro o de un recipiente|Heat bath"><svg class="ico"><use href="#o-bano-termico"/></svg><span>Baño térmico</span></button>
          <button class="herr" data-herr="gas" data-ayuda="Gas ideal para un recipiente vacío|Ideal gas"><svg class="ico"><use href="#o-gas"/></svg><span>Gas</span></button>
          
          <button class="herr" data-herr="globo" data-ayuda="Globo aerostático con quemador|Hot-air balloon"><svg class="ico"><use href="#o-globo"/></svg><span>Globo</span></button>
          <button class="herr" data-herr="columna" data-ayuda="Columna de líquido con una burbuja que sube|Liquid column"><svg class="ico"><use href="#o-columna-liquido"/></svg><span>Columna de líquido</span></button>
        </div>
      </div>
      <div class="seccion">
        <div class="panel-cab">Instrumentos</div>
        <div class="paleta" id="paleta-instrumentos">
          <button class="herr" data-herr="termometro" data-ayuda="Termómetro: clic en el gas que quieres medir|Thermometer"><svg class="ico"><use href="#n-termometro"/></svg><span>Termómetro</span></button>
          <button class="herr" data-herr="manometro" data-ayuda="Manómetro: clic en el gas que quieres medir|Pressure gauge"><svg class="ico"><use href="#n-manometro"/></svg><span>Manómetro</span></button>
          <button class="herr" data-herr="regla" data-ayuda="Regla: arrastra de un extremo al otro|Ruler"><svg class="ico"><use href="#n-regla"/></svg><span>Regla</span></button>
          <button class="herr" data-herr="cronometro" data-ayuda="Cronómetro: clic donde va|Stopwatch"><svg class="ico"><use href="#n-cronometro"/></svg><span>Cronómetro</span></button>
        </div>
      </div>
      <div class="seccion">
        <div class="panel-cab">Escena<span class="sp"></span><button class="btn btn-compacto btn-icono" id="b-vacia" data-ayuda="Escena vacía|New empty scene"><svg class="ico"><use href="#i-mas"/></svg></button></div>
        <div class="arbol" id="arbol"></div>
      </div>
    </div>
  </aside>

  <!-- ============================ Lienzo ============================ -->
  <main class="lienzo-area" id="area">
    <canvas id="lienzo"></canvas>
    <div class="flotante ar-der" role="group" aria-label="Capas">
      <svg class="ico"><use href="#i-capas"/></svg>
      <button class="capa-btn" data-capa="moleculas" aria-pressed="true">Moléculas</button>
      <button class="capa-btn" data-capa="vectores" aria-pressed="true">Vectores</button>
      <button class="capa-btn" data-capa="instrumentos" aria-pressed="true">Instrumentos</button>
      <button class="capa-btn" data-capa="cotas" aria-pressed="true">Cotas</button>
    </div>
    <div class="flotante ab-izq" id="coords"><span class="sim">x</span><span class="num" id="cx">—</span><span class="sim">y</span><span class="num" id="cy">—</span></div>
    <div class="flotante ab-der">
      <button class="btn btn-icono btn-compacto" id="b-zoom-menos" data-ayuda="Alejar|Zoom out|−"><svg class="ico"><use href="#i-zoom-menos"/></svg></button>
      <span class="num" id="zoom">100 %</span>
      <button class="btn btn-icono btn-compacto" id="b-zoom-mas" data-ayuda="Acercar|Zoom in|+"><svg class="ico"><use href="#i-zoom-mas"/></svg></button>
      <span class="sep"></span>
      <button class="btn btn-compacto" id="b-encuadrar" data-ayuda="Encuadrar todo|Fit to view|F"><svg class="ico"><use href="#i-encuadrar"/></svg>Encuadrar</button>
    </div>
    <div class="aviso-flotante aviso-lienzo" id="aviso" hidden><svg class="ico"><use href="#i-evento"/></svg><span id="aviso-texto"></span><button class="btn btn-compacto" id="aviso-deshacer">Deshacer</button></div>
  </main>

  <!-- ============================ Panel derecho ============================ -->
  <aside class="panel panel-der">
    <div class="desplaza">
      <div class="panel-cab">Inspector</div>
      <div class="insp-cab">
        <div class="miniatura"><svg class="ico"><use id="insp-ico" href="#o-gas"/></svg></div>
        <div><div class="t1" id="insp-nombre">Gas</div><div class="t2" id="insp-estado"></div></div>
      </div>
      <details class="grupo" open>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg>Propiedades</summary>
        <div id="propiedades"></div>
      </details>
      <details class="grupo" open id="grupo-examen" hidden>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg><span id="examen-titulo">Examen</span></summary>
        <div class="examen" id="examen"></div>
      </details>
      <details class="grupo" open>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg><span id="acc-titulo">Acciones</span></summary>
        <div id="acciones-otro" hidden></div>
        <div id="acciones-cilindro">
        <div class="fila" id="fila-pesa"><span class="etq">Pesa</span><button class="btn btn-secundario btn-compacto" id="a-pesa" data-ayuda="Poner o quitar la pesa en este instante|Add or remove the weight|P"><svg class="ico"><use href="#o-pesa"/></svg><span>Poner la pesa</span></button></div>
        <div class="fila"><span class="etq">Calentador</span><label class="conmutador" data-ayuda="Encender o apagar en este instante|Heater on/off|C"><input type="checkbox" class="interruptor" id="a-cal"><span id="a-cal-txt">Apagado</span></label></div>
        <div class="fila"><span class="etq">Paredes</span><div class="segmentado texto" id="a-paredes" data-ayuda="Conductoras: en contacto con el baño. Adiabáticas: sin calor|Diathermal / adiabatic walls|A"><button data-v="conductoras">Conductoras</button><button data-v="adiabaticas">Adiabáticas</button></div></div>
        <div class="fila"><span class="etq">Modelo</span><div class="segmentado texto" id="a-motor" data-ayuda="Dinámico: el émbolo tiene inercia y oscila. Cuasiestático: pasa por estados de equilibrio y la pesa se carga poco a poco|Dynamic / quasi-static"><button data-v="dinamico">Dinámico</button><button data-v="cuasiestatico">Cuasiestático</button></div></div>
        </div>
        <p class="ayuda-fila">Cada acción queda como evento en la línea de tiempo.</p>
      </details>
      <details class="grupo" open>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg>Mostrar</summary>
        <label class="casilla"><input type="checkbox" id="m-q" checked>Calor que entra y sale<span class="muestra" style="color:var(--f-termico)"></span></label>
        <label class="casilla" id="c-m-f"><input type="checkbox" id="m-f"><span id="m-f-txt">Fuerzas sobre el émbolo</span><span class="muestra" style="color:var(--f-interaccion)"></span></label>
        <label class="casilla" id="c-m-v"><input type="checkbox" id="m-v" checked><span id="m-v-txt">Velocidad del émbolo</span><span class="muestra" style="color:var(--f-movimiento)"></span></label>
        <label class="casilla" id="c-m-r"><input type="checkbox" id="m-r" checked>Isoterma y adiabática<span class="muestra discontinua" style="color:var(--texto-3)"></span></label>
      </details>
      <details class="grupo" open>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg><span id="lect-titulo">Lecturas</span></summary>
        <div class="lecturas" id="lecturas"></div>
      </details>
      <div class="panel-cab" style="border-top:1px solid var(--linea-suave)">Variables<span class="sp"></span></div>
      <div class="variables" id="variables"></div>
    </div>
  </aside>

  <!-- ============================ Panel inferior ============================ -->
  <section class="panel panel-inf">
    <div class="inf-cab">
      <div class="pestanas" role="tablist" id="pest">
        <button class="pestana" role="tab" aria-selected="true" aria-controls="p-graficas">Gráficas</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-energia">Energía</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-eventos">Eventos</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-tabla">Tabla</button>
      </div>
      <span class="sp" style="flex:1"></span>
      <button class="btn btn-compacto" id="b-exportar"><svg class="ico"><use href="#i-exportar"/></svg>Exportar datos</button>
    </div>
    <div class="linea-tiempo"><canvas id="tl"></canvas></div>
    <div class="graficas" id="p-graficas" data-grupo="pest">
      <div class="grafica"><div class="grafica-cab"><span id="t1"><span class="sim">P</span> (kPa) contra <span class="sim">V</span> (L)</span><span class="lect" id="l1"></span></div><canvas id="g1"></canvas></div>
      <div class="grafica"><div class="grafica-cab"><span id="t2"><span class="sim">T</span> contra <span class="sim">t</span></span><span class="lect" id="l2"></span></div><canvas id="g2"></canvas></div>
      <div class="grafica"><div class="grafica-cab"><span id="t3"><span class="sim">h</span> contra <span class="sim">t</span></span><span class="lect" id="l3"></span></div><canvas id="g3"></canvas></div>
    </div>
    <div class="energia" id="p-energia" data-grupo="pest" hidden>
      <div class="barras" id="e-gas"></div>
      <div class="barras" id="e-embolo"></div>
      <div class="grafica"><div class="grafica-cab"><span class="leyenda" id="t4"><span style="color:var(--f-termico)"><i></i><span class="sim">Q</span></span><span style="color:var(--tinta)"><i class="discontinua"></i><span class="sim">W</span></span><span style="color:var(--tinta)"><i></i><span class="sim">ΔU</span></span></span><span class="lect">J</span></div><canvas id="g4"></canvas></div>
    </div>
    <div class="lista-eventos" id="p-eventos" data-grupo="pest" hidden><table class="tabla" id="t-eventos"></table></div>
    <div class="lista-eventos" id="p-tabla" data-grupo="pest" hidden><table class="tabla" id="t-datos"></table></div>
  </section>
</div>

<!-- Menú de escenas -->
<div class="menu" id="menu-escenas" role="menu" hidden></div>

<!-- Paleta de comandos -->
<div class="velo comandos-velo" id="velo-comandos" hidden>
  <div class="comandos" role="dialog" aria-label="Comandos">
    <div class="comandos-buscar"><svg class="ico ico-20" style="color:var(--texto-3)"><use href="#i-buscar"/></svg><input id="cmd-q" placeholder="Escribe un comando o un objeto"><kbd>Esc</kbd></div>
    <div class="comandos-lista" id="cmd-lista"></div>
  </div>
</div>

<script type="module" src="../lienzo/trazo.js"></script>
<script type="module" src="../lienzo/dominios/termodinamica.js"></script>
<script type="module" src="../lienzo/grafica.js"></script>
<script type="module" src="../componentes/linea-tiempo.js"></script>
<script type="module" src="../componentes/espacio.js"></script>
<script type="module" src="termodinamica.js"></script>
</body>
</html>
