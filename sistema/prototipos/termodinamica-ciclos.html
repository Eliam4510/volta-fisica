<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta · Termodinámica · Ciclos y diagrama P-V</title>
<link rel="stylesheet" href="../fuentes/fuentes.css">
<link rel="icon" href="../marca/icono-app.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../componentes/componentes.css">
<script src="../iconos/sprite.js"></script>
<style>
  /* Solo ajustes propios de esta pantalla; todo lo demás viene del sistema */
  .migas { flex: none; }
  .escena-btn { gap: var(--e-2); min-width: 0; max-width: 480px; padding: 0 var(--e-2); color: var(--texto-3); font-weight: 400; }
  .escena-btn b { color: var(--texto-2); font-weight: var(--peso-medio); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .escena-btn .ico { color: var(--texto-3); }
  #menu-escenas { position: fixed; z-index: 40; min-width: 380px; max-height: calc(100vh - 64px); overflow: auto; }
  #menu-escenas .menu-item .nombre-escena { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu-escenas .menu-item .chip { margin-left: auto; flex: none; }
  #menu-escenas .menu-item[aria-current="true"] { background: var(--campo); }
  .grafica-cab .sim sub, .lecturas .sim .r { font-style: normal; }
  .aviso-lienzo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila .segmentado { justify-self: start; }
  .fila .segmentado button { padding: 0 7px; }
  .acciones-fila { display: flex; gap: var(--e-1); flex-wrap: wrap; padding: 0 var(--e-3) var(--e-2); }
  .lecturas .sim.palabra { font-style: normal; font-family: var(--fuente-interfaz); font-size: var(--t-pequeno); }
  .var { grid-template-columns: 46px minmax(0, 1fr) minmax(84px, auto); }
  .var .sim { text-align: left; white-space: nowrap; }
  .examen { display: flex; flex-direction: column; gap: 5px; }
  .ex-fila { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 30px 26px; align-items: baseline; column-gap: 6px; font-size: var(--t-pequeno); }
  .ex-n { color: var(--texto-3); font-family: var(--fuente-numeros); font-size: 11px; }
  .ex-etq { color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-etq .sim { font-size: 14px; }
  .ex-etq sub { font-size: .72em; }
  .ex-v { text-align: right; font-family: var(--fuente-numeros); font-variant-numeric: tabular-nums; color: var(--texto); }
  .ex-u { color: var(--texto-3); font-size: 11px; }
  .ex-op { color: var(--texto-3); font-family: var(--fuente-numeros); font-size: 11px; text-align: right; }
  .energia { grid-auto-flow: initial; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .barra-e { grid-template-columns: 128px minmax(0, 1fr) 84px; }
  .tabla td.texto { font-family: var(--fuente-interfaz); }
</style>
</head>
<body>
<div class="espacio">
  <!-- ============================ Barra superior ============================ -->
  <header class="barra">
    <a class="marca" href="inicio.html" data-ayuda="Inicio|Home">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6.5 L16 23 L26 6.5" stroke-width="2.4"/><path d="M4 23 H28" stroke-width="2.4"/><path d="M8.5 23 L5.5 26 M13.5 23 L10.5 26 M18.5 23 L15.5 26 M23.5 23 L20.5 26" stroke-width="1.4"/><circle cx="26" cy="6.5" r="2.6" fill="currentColor" stroke="none"/></svg>
      <b>Volta</b>
    </a>
    <span class="separador-v"></span>
    <nav class="migas">
      <button class="btn btn-compacto">Termodinámica<svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
      <span class="sep">/</span>
      <button class="btn btn-compacto">Ciclos y diagrama P-V<svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
    </nav>
    <button class="btn btn-compacto escena-btn" id="b-escenas" aria-haspopup="menu" data-ayuda="Cambiar de escena|Scenes"><span id="escena-chip" class="chip">Tutorial</span><b id="escena-nombre"></b><svg class="ico"><use href="#i-chevron-abajo"/></svg></button>
    <span class="sp"></span>
    <div class="transporte">
      <button class="btn btn-icono" id="b-reiniciar" data-ayuda="Reiniciar|Reset|Inicio"><svg class="ico"><use href="#i-reiniciar"/></svg></button>
      <button class="btn btn-icono" id="b-atras" data-ayuda="Retroceder un cuadro|Step back|←"><svg class="ico"><use href="#i-paso-atras"/></svg></button>
      <button class="btn btn-primario btn-reproducir" id="b-play" data-ayuda="Reproducir|Play|Espacio"><svg class="ico"><use href="#i-reproducir"/></svg></button>
      <button class="btn btn-icono" id="b-adelante" data-ayuda="Avanzar un cuadro|Step forward|→"><svg class="ico"><use href="#i-paso-adelante"/></svg></button>
    </div>
    <div class="reloj" id="reloj"></div>
    <div class="segmentado" data-exclusivo id="velocidades" data-ayuda="Velocidad de reproducción|Playback speed">
      <button data-v="0.5">½×</button><button data-v="1" aria-pressed="true">1×</button><button data-v="2">2×</button><button data-v="4">4×</button>
    </div>
    <span class="sp"></span>
    <span class="modo" data-ayuda="Procesos cuasiestáticos: el gas pasa por estados de equilibrio y Q, W y ΔU salen de fórmulas exactas|Quasi-static">Cuasiestático</span>
    <span class="separador-v"></span>
    <button class="btn btn-icono" id="b-deshacer" disabled data-ayuda="Deshacer|Undo|Ctrl Z"><svg class="ico"><use href="#i-deshacer"/></svg></button>
    <button class="btn btn-icono" id="b-rehacer" disabled data-ayuda="Rehacer|Redo|Ctrl Y"><svg class="ico"><use href="#i-rehacer"/></svg></button>
    <button class="btn btn-icono" data-accion="abrir" data-ayuda="Abrir escena (cualquier módulo)|Open|Ctrl O"><svg class="ico"><use href="#i-carpeta"/></svg></button>
    <button class="btn btn-icono" data-accion="guardar" data-ayuda="Guardar escena (Mayús: guardar como)|Save|Ctrl S"><svg class="ico"><use href="#i-guardar"/></svg></button>
    <button class="btn btn-icono" data-accion="tema" data-ayuda="Cambiar tema|Theme"><svg class="ico"><use href="#i-tema-oscuro"/></svg></button>
    <button class="btn btn-icono" id="b-comandos" data-ayuda="Comandos|Command palette|Ctrl K"><svg class="ico"><use href="#i-buscar"/></svg></button>
  </header>

  <!-- ============================ Panel izquierdo ============================ -->
  <aside class="panel panel-izq">
    <div class="desplaza">
      <div class="seccion">
        <div class="panel-cab">Procesos</div>
        <div class="paleta" id="paleta-procesos">
          <button class="herr" data-herr="isobarico" data-ayuda="Isobárico: clic en el diagrama para elegir el volumen final|Isobaric|1"><svg class="ico"><use href="#o-embolo"/></svg><span>Isobárico</span></button>
          <button class="herr" data-herr="isocorico" data-ayuda="Isocórico: clic en el diagrama para elegir la presión final|Isochoric|2"><svg class="ico"><use href="#o-recipiente"/></svg><span>Isocórico</span></button>
          <button class="herr" data-herr="isotermico" data-ayuda="Isotérmico: clic para elegir el volumen final sobre la isoterma|Isothermal|3"><svg class="ico"><use href="#o-bano-termico"/></svg><span>Isotérmico</span></button>
          <button class="herr" data-herr="adiabatico" data-ayuda="Adiabático: clic para elegir el volumen final sobre la adiabática|Adiabatic|4"><svg class="ico"><use href="#o-calorimetro"/></svg><span>Adiabático</span></button>
          <button class="herr" data-herr="recta" data-ayuda="Recta en el diagrama P-V hasta el punto del clic|Straight line|5"><svg class="ico"><use href="#i-grafica"/></svg><span>Recta en P-V</span></button>
        </div>
        <div class="acciones-fila">
          <button class="btn btn-secundario btn-compacto" id="b-cerrar" data-ayuda="Añade el tramo que vuelve al estado inicial: con el proceso elegido si llega, o con una recta|Close the cycle"><svg class="ico"><use href="#i-check"/></svg>Cerrar el ciclo</button>
          <button class="btn btn-secundario btn-compacto" id="b-quitar" data-ayuda="Quita el último tramo|Remove last step|Supr"><svg class="ico"><use href="#i-borrar"/></svg>Quitar el último</button>
        </div>
      </div>
      <div class="seccion">
        <div class="panel-cab">Escena</div>
        <div class="arbol" id="arbol"></div>
      </div>
    </div>
  </aside>

  <!-- ============================ Lienzo ============================ -->
  <main class="lienzo-area" id="area">
    <canvas id="lienzo"></canvas>
    <div class="flotante ar-der" role="group" aria-label="Capas">
      <svg class="ico"><use href="#i-capas"/></svg>
      <button class="capa-btn" data-capa="referencias" aria-pressed="true" data-ayuda="Isoterma y adiabática que pasan por el estado actual|Reference curves|R">Isoterma y adiabática</button>
      <button class="capa-btn" data-capa="calor" aria-pressed="true" data-ayuda="Calor de cada tramo junto a su curva|Heat per step|Q">Calor por tramo</button>
      <button class="capa-btn" data-capa="cilindro" aria-pressed="true" data-ayuda="Cilindro con el gas en el estado actual|Cylinder">Cilindro</button>
    </div>
    <div class="flotante ab-izq" id="coords"><span class="sim">V</span><span class="num" id="cx">—</span><span class="sim">P</span><span class="num" id="cy">—</span></div>
    <div class="flotante ab-der">
      <button class="btn btn-icono btn-compacto" id="b-zoom-menos" data-ayuda="Alejar|Zoom out|−"><svg class="ico"><use href="#i-zoom-menos"/></svg></button>
      <span class="num" id="zoom">100 %</span>
      <button class="btn btn-icono btn-compacto" id="b-zoom-mas" data-ayuda="Acercar|Zoom in|+"><svg class="ico"><use href="#i-zoom-mas"/></svg></button>
      <span class="sep"></span>
      <button class="btn btn-compacto" id="b-encuadrar" data-ayuda="Encuadrar todo|Fit to view|F"><svg class="ico"><use href="#i-encuadrar"/></svg>Encuadrar</button>
    </div>
    <div class="aviso-flotante aviso-lienzo" id="aviso" hidden><svg class="ico"><use href="#i-evento"/></svg><span id="aviso-texto"></span><button class="btn btn-compacto" id="aviso-deshacer">Deshacer</button></div>
  </main>

  <!-- ============================ Panel derecho ============================ -->
  <aside class="panel panel-der">
    <div class="desplaza">
      <div class="panel-cab">Inspector</div>
      <div class="insp-cab">
        <div class="miniatura"><svg class="ico"><use id="insp-ico" href="#o-gas"/></svg></div>
        <div><div class="t1" id="insp-nombre"></div><div class="t2" id="insp-estado"></div></div>
      </div>
      <details class="grupo" open>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg><span id="props-titulo">Propiedades</span></summary>
        <div id="propiedades"></div>
      </details>
      <details class="grupo" open id="grupo-examen" hidden>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg><span id="examen-titulo">Examen</span></summary>
        <div class="examen" id="examen"></div>
      </details>
      <details class="grupo" open>
        <summary><svg class="ico"><use href="#i-chevron-abajo"/></svg><span id="lect-titulo">Lecturas</span></summary>
        <div class="lecturas" id="lecturas"></div>
      </details>
      <div class="panel-cab" style="border-top:1px solid var(--linea-suave)">Variables</div>
      <div class="variables" id="variables"></div>
    </div>
  </aside>

  <!-- ============================ Panel inferior ============================ -->
  <section class="panel panel-inf">
    <div class="inf-cab">
      <div class="pestanas" role="tablist" id="pest">
        <button class="pestana" role="tab" aria-selected="true" aria-controls="p-graficas">Gráficas</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-tramos">Tramos</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-energia">Energía</button>
        <button class="pestana" role="tab" aria-selected="false" aria-controls="p-estados">Estados</button>
      </div>
      <span class="sp" style="flex:1"></span>
      <button class="btn btn-compacto" id="b-exportar" data-ayuda="Exportar estados y tramos a CSV|Export data"><svg class="ico"><use href="#i-exportar"/></svg>Exportar datos</button>
    </div>
    <div class="linea-tiempo"><canvas id="tl"></canvas></div>
    <div class="graficas" id="p-graficas" data-grupo="pest">
      <div class="grafica"><div class="grafica-cab"><span><span class="sim">V</span> (<span id="uV">L</span>) contra <span class="sim">T</span> (K)</span><span class="lect" id="l1"></span></div><canvas id="g1"></canvas></div>
      <div class="grafica"><div class="grafica-cab"><span><span class="sim">P</span> (kPa) contra <span class="sim">T</span> (K)</span><span class="lect" id="l2"></span></div><canvas id="g2"></canvas></div>
      <div class="grafica"><div class="grafica-cab"><span class="leyenda"><span style="color:var(--f-termico)"><i></i><span class="sim">Q</span></span><span style="color:var(--tinta)"><i class="discontinua"></i><span class="sim">W</span></span><span style="color:var(--tinta)"><i></i>Δ<span class="sim">U</span></span></span><span class="lect" id="l3">J</span></div><canvas id="g3"></canvas></div>
    </div>
    <div class="lista-eventos" id="p-tramos" data-grupo="pest" hidden><table class="tabla" id="t-tramos"></table></div>
    <div class="energia" id="p-energia" data-grupo="pest" hidden>
      <div class="barras" id="e-flujo"></div>
      <div class="barras" id="e-rend"></div>
    </div>
    <div class="lista-eventos" id="p-estados" data-grupo="pest" hidden><table class="tabla" id="t-estados"></table></div>
  </section>
</div>

<!-- Menú de escenas -->
<div class="menu" id="menu-escenas" role="menu" hidden></div>

<!-- Paleta de comandos -->
<div class="velo comandos-velo" id="velo-comandos" hidden>
  <div class="comandos" role="dialog" aria-label="Comandos">
    <div class="comandos-buscar"><svg class="ico ico-20" style="color:var(--texto-3)"><use href="#i-buscar"/></svg><input id="cmd-q" placeholder="Escribe un comando o una escena"><kbd>Esc</kbd></div>
    <div class="comandos-lista" id="cmd-lista"></div>
  </div>
</div>

<script type="module" src="../lienzo/trazo.js"></script>
<script type="module" src="../lienzo/dominios/termodinamica.js"></script>
<script type="module" src="../lienzo/grafica.js"></script>
<script type="module" src="../componentes/linea-tiempo.js"></script>
<script type="module" src="../componentes/espacio.js"></script>
<script type="module" src="termodinamica-ciclos.js"></script>
</body>
</html>
